; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:cpu1]
platform = teensy
board = teensy41
framework = arduino
monitor_port = COM9
monitor_speed = 115200
upload_port = COM9
build_src_filter = +<cpu1/> +<shared/>
; CPU1: Modbus TCP / Ethernet, shift register IO, I2C slave. Libraries are pinned to the commits that were tested.
lib_deps = 
	https://github.com/robtillaart/FastShiftIn.git#2876ff737aec3a4f1f40fd1cf28341c920c65bb4
	https://github.com/arduino-libraries/ArduinoModbus.git#3b71ed1da7cdeba451dd70088ea7f232bb493cda
	https://github.com/arduino-libraries/ArduinoRS485.git#3299919ce0458115fb02a8ada38a4b82848c12b5

[env:cpu2]
platform = teensy
board = teensy41
framework = arduino
monitor_port = COM10
monitor_speed = 115200
upload_port = COM10
build_src_filter = +<cpu2/> +<shared/>
; CPU2: steppers and homing, I2C master. Libraries are pinned to the commit that was tested.
lib_deps = 
	https://github.com/luni64/TeensyStep4.git#42e1f69450902c7f96d7cd11ab079036adc36d18
